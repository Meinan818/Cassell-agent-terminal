[package]
name = "cassell-agent-terminal"
version = "0.1.9"
description = "卡塞尔专员终端 — Cassell College specialist AI agent desktop terminal (Tauri 2 + React + Codex CLI engine)"
authors = ["Meinan818"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cassell_agent_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# P0-11④ 真终端：后端 PTY（天枢同款）。Windows 上是 ConPTY，
# Linux/macOS 上是 forkpty；不走 tokio::process::Command，不弹控制台窗口。
portable-pty = "0.8"
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros", "sync", "time", "fs"] }
# 直连模型服务商（OpenAI 兼容的 /v1/chat/completions），
# 让应用自己就是 agent，不再依赖外部命令行工具。
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# P0-1：冻结前缀的 sha256 校验；P0-2：DSML 标记解析。
sha2 = "0.10"
regex = "1"

# P0-11③ autoVerify：从 WebView2 子 webview 截 PNG 帧。
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
